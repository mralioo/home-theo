services:
  orchestrator:
    build: .
    ports:
      - "8080:8080"
    environment:
      USE_LLM: "${USE_LLM:-0}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LITELLM_MODEL: "${LITELLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}"
      DB_PATH: "/data/ops.db"
    volumes:
      - ./data:/data
      - ./app:/srv/app
    restart: unless-stopped

  adk-ui:
    build: .
    command: >
      sh -c "adk web /srv/adk_agents --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    environment:
      USE_LLM: "1"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LITELLM_MODEL: "${LITELLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}"
      ORCHESTRATOR_URL: "http://orchestrator:8080"
      PYTHONPATH: "/srv"
    volumes:
      - ./app:/srv/app
      - ./adk_agents:/srv/adk_agents
    depends_on:
      - orchestrator
    restart: unless-stopped
